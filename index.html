<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAQA GAMES</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #080711;
            color: #ffffff;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            text-align: center;
            margin-bottom: 25px;
            margin-top: 10px;
        }
        h1 {
            font-size: 2.2rem;
            color: #00f0ff;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
            letter-spacing: 2px;
            font-weight: 900;
        }
        p.subtitle {
            color: #aaa;
            font-size: 0.9rem;
            margin-top: 5px;
        }
        .games-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .game-card {
            background: rgba(20, 20, 35, 0.85);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .game-title {
            font-size: 1.4rem;
            color: #00f0ff;
            font-weight: bold;
            text-transform: uppercase;
        }
        .game-desc {
            font-size: 0.85rem;
            color: #ccc;
            line-height: 1.4;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.85rem;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .btn-play {
            background: #00f0ff;
            color: #000;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
        }
        .btn-apk {
            background: #ff0055;
            color: #fff;
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.4);
        }
        .btn:active {
            transform: scale(0.95);
        }
        .loading {
            text-align: center;
            color: #00f0ff;
            font-size: 1.1rem;
            padding: 30px;
        }
        footer {
            margin-top: auto;
            padding-top: 30px;
            color: #666;
            font-size: 0.8rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>MAQA GAMES</h1>
        <p class="subtitle">Android • iOS • PC Oyun Portalı</p>
    </header>

    <div class="games-container" id="games-list">
        <div class="loading">Oyunlar GitHub'dan Yükleniyor...</div>
    </div>

    <footer>
        © 2026 MAQA Games
    </footer>

    <script>
        const GITHUB_USERNAME = "maqa201110-cyber"; 
        const REPO_NAME = "naqa-game";

        // Oyun ismini temizleyip ortak anahtar yapma fonksiyonu
        function normalizeName(filename) {
            let name = filename.replace(/\.[^/.]+$/, ""); // uzantıyı sil (.apk, .html)
            name = name.replace(/[-_]/g, " "); // tire ve alt tireyi boşluk yap
            name = name.replace(/\b(v\d*|version\d*|final|beta|demo)\b/gi, ""); // v1, v, version vs. sil
            return name.trim().toUpperCase();
        }

        async function fetchGames() {
            const container = document.getElementById('games-list');
            try {
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents`);
                if (!response.ok) throw new Error("GitHub bağlantı hatası");
                
                const files = await response.json();
                const gamesMap = {};

                files.forEach(file => {
                    const name = file.name;
                    
                    if (name === "index.html" || name.startsWith(".")) return;

                    const ext = name.split('.').pop().toLowerCase();
                    if (ext === 'apk' || ext === 'html') {
                        const gameKey = normalizeName(name) || "OYUN";

                        if (!gamesMap[gameKey]) {
                            gamesMap[gameKey] = { displayName: gameKey, apk: null, html: null };
                        }

                        if (ext === 'apk') gamesMap[gameKey].apk = file.download_url;
                        if (ext === 'html') gamesMap[gameKey].html = file.name;
                    }
                });

                const keys = Object.keys(gamesMap);
                if (keys.length === 0) {
                    container.innerHTML = '<div class="loading">Henüz yüklü oyun bulunamadı.</div>';
                    return;
                }

                container.innerHTML = '';

                keys.forEach(key => {
                    const game = gamesMap[key];
                    const card = document.createElement('div');
                    card.className = 'game-card';

                    let buttonsHTML = '<div class="btn-group">';
                    if (game.html) {
                        buttonsHTML += `<a href="${game.html}" class="btn btn-play">▶ TARAYICIDA OYNA</a>`;
                    }
                    if (game.apk) {
                        buttonsHTML += `<a href="${game.apk}" class="btn btn-apk" download>📥 APK İNDİR</a>`;
                    }
                    buttonsHTML += '</div>';

                    card.innerHTML = `
                        <div class="game-title">${game.displayName}</div>
                        <div class="game-desc">MAQA Games oyunu! Hemen tarayıcıda oyna veya cihazına indir.</div>
                        ${buttonsHTML}
                    `;
                    container.appendChild(card);
                });

            } catch (error) {
                console.error(error);
                container.innerHTML = '<div class="loading" style="color:#ff0055;">Oyunlar yüklenirken bir sorun oluştu.</div>';
            }
        }

        fetchGames();
    </script>
</body>
</html>
